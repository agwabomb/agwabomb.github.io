name: Update Steam Games

on:
  schedule:
    # 매일 자정(KST) = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-steam-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Steam library
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/fetch_steam.py

      - name: Commit and push if steam-games.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-games.json
          if git diff --cached --quiet; then
            echo "steam-games.json is unchanged."
          else
            git commit -m "chore: update steam-games.json from Steam Web API"
            git push
          fi
